version: 2.1

jobs:
  compile_build-nightly-integration-tests:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: light speed
          command: |
            mkdir -p /tmp/stage
            { set +o pipefail 2>/dev/null; uname -mnrs; true ; } > /tmp/stage/output.out
            echo "gate build-nightly-integration-tests: $(wc -c </tmp/stage/output.out) bytes total"
      - persist_to_workspace:
          root: /tmp/stage
          paths:
            - output.out
  build-nightly-integration-tests:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
          name: Verify previous
          command: |
            cat /tmp/stage/output.out
      - run:
          name: Get source tree
          command: git clone --depth 1 --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Extract archive
          command: tar --extract --xz -f archive.tar.xz
      - run:
          name: Store metadata
          no_output_timeout: 15m
          command: sleep 90
      - run:
          no_output_timeout: 71m
          command: "./adapter"
  A_produce-production-test-matrix:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
